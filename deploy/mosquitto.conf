# Mosquitto config for the jumphost -- device-facing plain listener (ESP32
# Ethernet has no TLS support at all, same constraint as the existing
# nginx/relay HTTP setup) plus a TLS listener for the Vercel publish path,
# which has no such limitation.
#
# Install: copy to /etc/mosquitto/conf.d/lyra.conf, then
#   sudo systemctl restart mosquitto

# ── Device-facing (ESP32, plain TCP) ────────────────────────────────────
listener 1883 0.0.0.0
protocol mqtt

# ── Server-facing (Vercel publish path, TLS) ────────────────────────────
listener 8883 0.0.0.0
protocol mqtt
cafile /etc/letsencrypt/live/lyra-app.co.in/chain.pem
certfile /etc/letsencrypt/live/lyra-app.co.in/fullchain.pem
keyfile /etc/letsencrypt/live/lyra-app.co.in/privkey.pem

# ── Auth ─────────────────────────────────────────────────────────────────
# No anonymous access on either listener. Device username = machine_id
# (the resolved UUID), password = that machine's device_secret. The
# server's own publish-only credential (lyra-server) is separate, not tied
# to any device -- see scripts/sync-mqtt-passwords.mjs for how this file
# and the ACL below get generated/kept in sync.
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/lyra.acl

# Keep persistent sessions across broker restarts so a machine's queued
# QoS-1 messages (payments that arrived while it was briefly disconnected)
# survive a broker restart, not just a device reconnect.
persistence true
persistence_location /var/lib/mosquitto/
