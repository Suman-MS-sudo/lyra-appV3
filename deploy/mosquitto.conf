# Mosquitto config for the jumphost -- device-facing plain listener (ESP32
# Ethernet has no TLS support at all, same constraint as the existing
# nginx/relay HTTP setup) plus a TLS listener for the Vercel publish path,
# which has no such limitation.
#
# Install: copy to /etc/mosquitto/conf.d/lyra.conf, then
#   sudo systemctl restart mosquitto

# ── Device-facing (ESP32, plain TCP) ────────────────────────────────────
listener 1883 0.0.0.0
protocol mqtt

# ── Server-facing (Vercel publish path, TLS) ────────────────────────────
# Points at copies of the Let's Encrypt cert under /etc/mosquitto/certs/,
# not /etc/letsencrypt/live/ directly -- that directory is root-only
# (0700) and the mosquitto user can't read into it at all. A certbot
# deploy hook keeps these copies in sync on every renewal; see
# deploy/mosquitto-cert-deploy-hook.sh.
listener 8883 0.0.0.0
protocol mqtt
cafile /etc/mosquitto/certs/chain.pem
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem

# ── Auth ─────────────────────────────────────────────────────────────────
# No anonymous access on either listener. Device username = machine_id
# (the resolved UUID), password = that machine's device_secret. The
# server's own publish-only credential (lyra-server) is separate, not tied
# to any device -- see scripts/sync-mqtt-passwords.mjs for how this file
# and the ACL below get generated/kept in sync.
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/lyra.acl

# Persistent sessions (so a machine's queued QoS-1 messages survive a
# broker restart, not just a device reconnect) are already enabled by
# Debian's default /etc/mosquitto/mosquitto.conf (persistence true +
# persistence_location /var/lib/mosquitto/) -- Mosquitto errors out on a
# directive set twice across included config files, so don't repeat it
# here. If your base config differs, add both lines back in.
