# nginx config for jumphost — terminates TLS for lyra-app.co.in and www using the
# certbot-issued Let's Encrypt cert, then reverse-proxies to the Vercel
# deployment's own domain (not lyra-app.co.in — that would loop back here).
#
# Install: copy to /etc/nginx/sites-available/lyra-relay.conf, then
#   sudo ln -s /etc/nginx/sites-available/lyra-relay.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

# ESP32 machines poll /api/payment_success every 4s. Caching here at the
# jumphost (keyed per machine via the mac query param) means only 1 in ~4
# polls reaches Vercel — keeping the Vercel free-plan usage down without
# changing the firmware's poll interval or payment-detection latency.
proxy_cache_path /var/cache/nginx/lyra-relay levels=1:2 keys_zone=lyra_payment_cache:10m max_size=100m inactive=5m use_temp_path=off;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lyra-app.co.in www.lyra-app.co.in;

    ssl_certificate     /etc/letsencrypt/live/lyra-app.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyra-app.co.in/privkey.pem;

    # nginx defaults to 1m here, which silently 413s anything over ~1MB --
    # bit anyone uploading an OTA firmware .bin through /admin/firmware
    # (this app's own route already allows up to 4MB, see
    # src/app/api/firmware/upload/route.ts's MAX_FIRMWARE_SIZE). 10m gives
    # headroom above the 4MB app-level cap without opening this up
    # unreasonably wide.
    client_max_body_size 10m;

    # A bare hostname in proxy_pass is resolved ONCE, at nginx start/reload,
    # and that IP is cached forever after. Vercel rotates its edge IPs
    # periodically -- when the cached IP goes stale, nginx marks it dead and
    # returns 502 "no live upstreams" for every request until the next
    # config reload forces a fresh DNS lookup (this bit us once already).
    # Using a variable in proxy_pass instead forces nginx to re-resolve via
    # this resolver on every cache-TTL expiry (valid=10s here), so a Vercel
    # IP rotation self-heals instead of needing a manual reload.
    resolver 8.8.8.8 8.8.4.4 valid=10s;
    set $vercel_upstream https://lyra-app-v3-chi.vercel.app;

    location = /api/payment_success {
        proxy_pass $vercel_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host lyra-app-v3-chi.vercel.app;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_cache lyra_payment_cache;
        proxy_cache_key "$request_uri";
        # Honor the app's own Cache-Control: the "No pending payments" response
        # sets s-maxage=15 (safe to cache), but the real payment-success
        # response sets no-store -- caching THAT would replay the same
        # dispense instruction to the machine on every poll for 15s, risking
        # a double dispense. Do not add proxy_ignore_headers Cache-Control here.
        proxy_cache_valid 200 15s;
        add_header X-Cache-Status $upstream_cache_status always;
    }

    location / {
        proxy_pass $vercel_upstream;
        proxy_ssl_server_name on;
        proxy_set_header Host lyra-app-v3-chi.vercel.app;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
