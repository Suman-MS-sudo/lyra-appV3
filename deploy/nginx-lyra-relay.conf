# nginx config for jumphost — terminates TLS for lyra-app.co.in using the
# certbot-issued Let's Encrypt cert, then reverse-proxies to the Vercel
# deployment's own domain (not lyra-app.co.in — that would loop back here).
#
# Install: copy to /etc/nginx/sites-available/lyra-relay.conf, then
#   sudo ln -s /etc/nginx/sites-available/lyra-relay.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lyra-app.co.in;

    ssl_certificate     /etc/letsencrypt/live/lyra-app.co.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lyra-app.co.in/privkey.pem;

    location / {
        proxy_pass https://lyra-app-v3-geegd7zfn-suman-ms-sudos-projects.vercel.app;
        proxy_ssl_server_name on;
        proxy_set_header Host lyra-app-v3-geegd7zfn-suman-ms-sudos-projects.vercel.app;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
