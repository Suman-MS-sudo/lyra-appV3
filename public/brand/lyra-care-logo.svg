<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Tile: bright → deep brand blue -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4b8dff"/>
      <stop offset="0.5" stop-color="#1f6bff"/>
      <stop offset="1" stop-color="#0a2d8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.74" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#7fe0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fe0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="depth" cx="0.2" cy="1" r="0.75">
      <stop offset="0" stop-color="#05164f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#05164f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6f0ff"/>
    </linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9fd0ff"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#bfe6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d9f3ff"/>
      <stop offset="1" stop-color="#7fe0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#glow)"/>
  <rect width="512" height="512" rx="116" fill="url(#depth)"/>
  <rect width="512" height="512" rx="116" fill="url(#sheen)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Orbit: a thin arc sweeping around the monogram, ending in a glowing node -->
  <path d="M86 300 C 70 210 150 116 270 92 C 350 76 418 96 444 138" fill="none" stroke="url(#orbit)" stroke-width="5" stroke-linecap="round"/>
  <circle cx="444" cy="138" r="22" fill="url(#node)"/>
  <circle cx="444" cy="138" r="7" fill="#ffffff"/>

  <!-- L -->
  <path d="M112 106 h56 v136 h58 v52 h-90 a24 24 0 0 1 -24 -24 z" fill="url(#white)"/>

  <!-- C -->
  <path d="M389.4 140.6 A 84 84 0 1 0 389.4 259.4" fill="none" stroke="url(#ice)" stroke-width="52" stroke-linecap="round"/>

  <!-- Spark -->
  <path d="M410 300 C 412 312 416 316 428 318 C 416 320 412 324 410 336 C 408 324 404 320 392 318 C 404 316 408 312 410 300 Z" fill="#ffffff"/>

  <!-- Heart -->
  <path d="M256 392 C 236 377 222 365 222 350 C 222 339 230 332 240 332 C 247 332 253 336 256 342 C 259 336 265 332 272 332 C 282 332 290 339 290 350 C 290 365 276 377 256 392 Z" fill="url(#white)"/>

  <!-- Leaves cradling the heart -->
  <path d="M134 356 C 158 396 198 414 242 414 C 251 408 251 398 245 391 C 206 391 168 380 134 356 Z" fill="url(#white)"/>
  <path d="M378 356 C 354 396 314 414 270 414 C 261 408 261 398 267 391 C 306 391 344 380 378 356 Z" fill="url(#ice)"/>
</svg>
